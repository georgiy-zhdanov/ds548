{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container my-5">
    <h2>{{ title }}</h2>
    <form method="POST" class="card p-4">
        <div class="mb-3">
            <label class="form-label">Название модуля</label>
            <input type="text" name="title" class="form-control" value="{{ module.title if module else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="4">{{ module.description if module else '' }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Порядковый номер модуля</label>
            <input type="number" name="order_num" class="form-control" value="{{ module.order_num if module else 0 }}">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="/modules" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
